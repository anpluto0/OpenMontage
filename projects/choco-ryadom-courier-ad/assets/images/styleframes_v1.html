<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
@font-face{font-family:Onest;font-weight:800;src:url(fonts/onest-cyrillic-800-normal.woff2)}
@font-face{font-family:Onest;font-weight:800;src:url(fonts/onest-latin-800-normal.woff2);unicode-range:U+0000-00FF,U+2010-2027,U+20B8}
@font-face{font-family:Onest;font-weight:500;src:url(fonts/onest-cyrillic-400-normal.woff2)}
@font-face{font-family:Onest;font-weight:500;src:url(fonts/onest-latin-400-normal.woff2);unicode-range:U+0000-00FF,U+2010-2027,U+20B8}
:root{--ink:#17171C;--paper:#F7F2EB;--white:#FFFFFF;--heart:#FA084E;--orange:#FEA202;--peach:#FFEFD5;--lime:#8CD23C;--lime2:#6DB22A;--block:#EDE6DC;--mute:#8B857C}
html,body{margin:0;background:#0E0E10}
.sheet{display:flex;gap:24px;padding:24px;width:max-content}
.fr{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--paper);font-family:Onest,sans-serif;color:var(--ink);zoom:.5;border-radius:24px}
.abs{position:absolute}
.h1{position:absolute;left:96px;font-weight:800;font-size:92px;line-height:104px;letter-spacing:-1.5px}
.card{position:absolute;background:var(--white);border-radius:36px;box-shadow:0 10px 0 rgba(23,23,28,.06)}
.chip{position:absolute;height:72px;border-radius:36px;padding:0 30px;font-weight:800;font-size:34px;line-height:72px;white-space:nowrap}
svg{display:block;overflow:visible}
</style></head><body><div class="sheet">

<!-- 1 · HOOK: map of the neighbourhood -->
<div class="fr" id="f1">
  <div class="h1" style="top:170px">Ищешь подработку</div>
  <div class="h1" style="top:274px;color:var(--orange)">рядом с домом?</div>
  <div class="card" style="left:64px;top:470px;width:952px;height:1060px;overflow:hidden;background:#EFE8DE">
    <svg id="map1" width="952" height="1060"></svg>
  </div>
  <div class="abs" style="left:830px;top:1880px"><svg id="c1" width="1" height="1"></svg></div>
</div>

<!-- 2 · DARKSTORE -->
<div class="fr" id="f2" style="background:var(--white)">
  <div class="h1" style="top:170px">Даркстор —</div>
  <div class="h1" style="top:274px">магазин <span style="color:var(--heart)">только</span></div>
  <div class="h1" style="top:378px;color:var(--heart)">для доставки</div>
  <svg class="abs" style="left:0;top:600px" width="1080" height="1320" id="store"></svg>
</div>

<!-- 3 · HOW IT WORKS: 2 km -->
<div class="fr" id="f3">
  <div class="abs" style="left:96px;top:170px;display:flex;gap:14px;align-items:center;font-weight:800;font-size:40px">
    <span class="step">1</span>Заказ<span style="color:var(--mute)">→</span><span class="step">2</span>Сборка<span style="color:var(--mute)">→</span><span class="step" style="background:var(--heart);color:#fff">3</span>Доставка
  </div>
  <div class="h1" style="top:270px">Едешь рядом —</div>
  <div class="h1" style="top:374px">до <span style="color:var(--heart)">2 км</span></div>
  <div class="card" style="left:64px;top:560px;width:952px;height:1100px;overflow:hidden;background:#EFE8DE">
    <svg id="map3" width="952" height="1100"></svg>
  </div>
</div>

<!-- 4 · REST ROOM -->
<div class="fr" id="f4" style="background:var(--peach)">
  <div class="h1" style="top:170px">Отвёз — и обратно</div>
  <div class="h1" style="top:274px;color:var(--orange)">в комнату отдыха</div>
  <svg class="abs" style="left:0;top:470px" width="1080" height="1450" id="lounge"></svg>
  <div class="chip" style="left:96px;top:1690px;background:var(--ink);color:#fff">Оплата даже без заказов</div>
  <div class="chip" style="left:96px;top:1782px;background:#fff;color:var(--ink)">Сумка бесплатно</div>
</div>

</div>
<style>.step{display:inline-block;width:60px;height:60px;border-radius:20px;background:var(--ink);color:#fff;text-align:center;line-height:60px;font-size:34px}</style>
<script>
const NS='http://www.w3.org/2000/svg';
const C={ink:'#17171C',heart:'#FA084E',orange:'#FEA202',peach:'#FFEFD5',lime:'#8CD23C',lime2:'#6DB22A',lime3:'#4E8A1A',skin:'#F2C29B',skin2:'#E2A97E',hair:'#2B2235',pants:'#2F3140',block:'#FFFFFF',road:'#EFE8DE',tree:'#C9E7A6'};
const el=(svg,html)=>{svg.insertAdjacentHTML('beforeend',html)};

// ---------- simple courier: rounded shapes, dot eyes ----------
function courier({x=0,y=0,s=1,pose='stand',jacket=C.lime,jacket2=C.lime2,skin=C.skin,hair=C.hair,hairStyle=0,bag=true,phone=false,wave=false}={}){
  const head=`<g>
    <circle cx="0" cy="-470" r="84" fill="${skin}"/>
    ${hairStyle===0?`<path d="M-86 -478 Q-90 -568 0 -568 Q90 -568 86 -478 Q60 -520 0 -514 Q-50 -510 -86 -478Z" fill="${hair}"/>`
      :hairStyle===1?`<path d="M-88 -470 Q-96 -572 0 -572 Q96 -572 88 -470 L88 -430 Q70 -500 20 -508 Q-40 -512 -88 -470Z" fill="${hair}"/><rect x="64" y="-500" width="30" height="110" rx="15" fill="${hair}"/>`
      :`<path d="M-84 -486 Q-80 -560 0 -562 Q80 -560 84 -486 Q40 -500 -84 -486Z" fill="${hair}"/>`}
    <circle cx="-30" cy="-466" r="10" fill="${C.ink}"/><circle cx="30" cy="-466" r="10" fill="${C.ink}"/>
    <path d="M-22 -432 Q0 -414 22 -432" stroke="${C.ink}" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="-54" cy="-440" r="14" fill="#FF8A8A" opacity=".35"/><circle cx="54" cy="-440" r="14" fill="#FF8A8A" opacity=".35"/>
  </g>`;
  const bagG=bag?`<rect x="-128" y="-420" width="256" height="250" rx="44" fill="${C.lime3}"/><rect x="-128" y="-420" width="256" height="70" rx="35" fill="${jacket2}"/>`:'';
  let body;
  if(pose==='stand'){
    body=`${bagG}
    <rect x="-66" y="-190" width="56" height="190" rx="26" fill="${C.pants}"/><rect x="10" y="-190" width="56" height="190" rx="26" fill="${C.pants}"/>
    <rect x="-80" y="-24" width="76" height="30" rx="15" fill="${C.ink}"/><rect x="4" y="-24" width="76" height="30" rx="15" fill="${C.ink}"/>
    <rect x="-104" y="-392" width="208" height="236" rx="72" fill="${jacket}"/>
    <rect x="-4" y="-372" width="8" height="200" rx="4" fill="${jacket2}"/>
    <rect x="-44" y="-396" width="88" height="34" rx="17" fill="${jacket2}"/>
    <rect x="-150" y="-370" width="54" height="${wave?150:190}" rx="27" fill="${jacket2}" ${wave?'transform="rotate(150 -123 -360)"':''}/>
    <rect x="96" y="-370" width="54" height="${phone?140:190}" rx="27" fill="${jacket2}" ${phone?'transform="rotate(-35 123 -360)"':''}/>
    ${phone?`<rect x="150" y="-330" width="64" height="104" rx="14" fill="${C.ink}" transform="rotate(-12 182 -278)"/><rect x="158" y="-320" width="48" height="80" rx="8" fill="#9FD7FF" transform="rotate(-12 182 -278)"/><circle cx="150" cy="-246" r="26" fill="${skin}"/>`
      :`<circle cx="123" cy="-176" r="26" fill="${skin}"/>`}
    ${wave?`<circle cx="-200" cy="-470" r="26" fill="${skin}"/>`:`<circle cx="-123" cy="-176" r="26" fill="${skin}"/>`}`;
  } else { // sit (seat height ~ -170)
    body=`${bagG.replace(/-420/g,'-400').replace(/-128/g,'-150')}
    <rect x="-70" y="-200" width="190" height="60" rx="30" fill="${C.pants}"/><rect x="60" y="-200" width="60" height="200" rx="28" fill="${C.pants}"/>
    <rect x="40" y="-24" width="96" height="30" rx="15" fill="${C.ink}"/>
    <rect x="-104" y="-392" width="208" height="230" rx="72" fill="${jacket}"/>
    <rect x="-44" y="-396" width="88" height="34" rx="17" fill="${jacket2}"/>
    <rect x="-150" y="-370" width="54" height="170" rx="27" fill="${jacket2}"/>
    <rect x="96" y="-370" width="54" height="150" rx="27" fill="${jacket2}" transform="rotate(-50 123 -360)"/>
    <circle cx="-123" cy="-196" r="26" fill="${skin}"/>
    <rect x="160" y="-330" width="46" height="56" rx="12" fill="#fff"/><rect x="200" y="-318" width="22" height="30" rx="11" fill="none" stroke="#fff" stroke-width="8"/>
    <circle cx="178" cy="-300" r="26" fill="${skin}"/>`;
  }
  return `<g transform="translate(${x} ${y}) scale(${s})">${body}${head}</g>`;
}

// ---------- map ----------
function map(svg,w,h,{home,store,circle,route}){
  for(let r=0;r<12;r++)for(let c=0;c<8;c++){
    const bx=24+c*124, by=24+r*124; const big=((r*3+c*5)%7===0);
    el(svg,`<rect x="${bx}" y="${by}" width="${big?224:100}" height="100" rx="22" fill="${C.block}"/>`);
    if((r*5+c*3)%6===0) el(svg,`<circle cx="${bx+50}" cy="${by+50}" r="26" fill="${C.tree}"/>`);
  }
  if(circle) el(svg,`<circle cx="${store[0]}" cy="${store[1]}" r="${circle}" fill="${C.heart}" fill-opacity=".07" stroke="${C.heart}" stroke-width="6" stroke-dasharray="18 16"/>`);
  if(route) el(svg,`<path d="${route}" fill="none" stroke="${C.ink}" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 22"/>`);
  if(home){ const [x,y]=home; el(svg,`<g transform="translate(${x} ${y})"><rect x="-70" y="-70" width="140" height="140" rx="30" fill="${C.orange}"/><path d="M-34 6 L0 -28 L34 6 V36 H-34Z" fill="#fff"/><rect x="-10" y="12" width="20" height="24" rx="4" fill="${C.orange}"/>
     <g transform="translate(0 -110)"><rect x="-74" y="-34" width="148" height="68" rx="34" fill="${C.ink}"/><text x="0" y="12" text-anchor="middle" font-family="Onest" font-weight="800" font-size="34" fill="#fff">Дом</text></g></g>`);}
  if(store){ const [x,y]=store; el(svg,`<g transform="translate(${x} ${y})"><rect x="-78" y="-78" width="156" height="156" rx="40" fill="#fff" stroke="${C.heart}" stroke-width="8"/>
     <path d="M0 40 C-60 0 -52 -44 -20 -44 C-8 -44 0 -36 0 -26 C0 -36 8 -44 20 -44 C52 -44 60 0 0 40Z" fill="${C.heart}" transform="scale(1.3) translate(0 4)"/></g>`);}
}
map(document.getElementById('map1'),952,1060,{home:[300,560],store:[640,340],route:'M300 560 Q470 520 640 340'});
el(document.getElementById('c1'),courier({x:0,y:0,s:.95,phone:true}));

map(document.getElementById('map3'),952,1100,{store:[476,520],circle:390,home:[740,300],route:'M476 520 L560 520 Q620 520 640 440 L700 330'});
el(document.getElementById('map3'),`<g transform="translate(476 952)"><rect x="-110" y="-40" width="220" height="80" rx="40" fill="${C.heart}"/><text x="0" y="14" text-anchor="middle" font-family="Onest" font-weight="800" font-size="40" fill="#fff">до 2 км</text></g>`);
el(document.getElementById('map3'),`<g transform="translate(610 470)"><circle r="46" fill="${C.lime}" stroke="#fff" stroke-width="8"/><circle cy="-8" r="16" fill="${C.skin}"/><rect x="-20" y="10" width="40" height="22" rx="11" fill="${C.lime3}"/></g>`);

// ---------- darkstore ----------
(function(){const s=document.getElementById('store');
  el(s,`<rect x="96" y="80" width="888" height="900" rx="48" fill="${C.paper||'#F7F2EB'}"/>`);
  el(s,`<rect x="96" y="80" width="888" height="150" rx="48" fill="#fff" stroke="${C.ink}" stroke-width="8"/><image href="../../hyperframes/assets/choco_logo.png" x="300" y="128" width="480" height="55"/>`);
  // shelves inside
  const prod=['#FFD43B','#FF6B6B','#FFFFFF','#8CD23C','#FEA202','#9FD7FF','#FA084E','#F2C29B'];
  for(let r=0;r<4;r++){ el(s,`<rect x="150" y="${300+r*160}" width="780" height="20" rx="10" fill="#D8CFC3"/>`);
    for(let i=0;i<9;i++){const w=60+((i*7+r*3)%3)*16, h=70+((i*5+r)%3)*20; el(s,`<rect x="${160+i*86}" y="${300+r*160-h}" width="${w}" height="${h}" rx="14" fill="${prod[(i+r*3)%8]}" stroke="#17171C" stroke-opacity=".08" stroke-width="3"/>`);}
  }
  // rolling shutter half open
  el(s,`<g><rect x="130" y="250" width="820" height="200" rx="18" fill="#D9D2C8"/>${[0,1,2,3].map(i=>`<rect x="130" y="${262+i*46}" width="820" height="8" rx="4" fill="#C6BEB2"/>`).join('')}</g>`);
  // door
  el(s,`<rect x="700" y="660" width="210" height="320" rx="24" fill="${C.ink}"/><rect x="712" y="700" width="186" height="76" rx="14" fill="#fff"/><text x="805" y="732" text-anchor="middle" font-family="Onest" font-weight="800" font-size="22" fill="${C.ink}">Только для</text><text x="805" y="760" text-anchor="middle" font-family="Onest" font-weight="800" font-size="22" fill="${C.heart}">курьеров</text>`);
  el(s,`<rect x="40" y="980" width="1000" height="40" rx="20" fill="#E9E2D8"/>`);
  el(s,courier({x:380,y:1150,s:1.02,wave:true}));
})();

// ---------- lounge ----------
(function(){const s=document.getElementById('lounge');
  el(s,`<rect x="96" y="60" width="888" height="1100" rx="48" fill="#fff"/>`);
  // clock
  el(s,`<g transform="translate(820 200)"><circle r="78" fill="${C.peach}" stroke="${C.ink}" stroke-width="10"/><path d="M0 0 V-46 M0 0 L32 18" stroke="${C.ink}" stroke-width="10" stroke-linecap="round"/></g>`);
  // phone card
  el(s,`<g transform="translate(150 140)"><rect width="380" height="200" rx="32" fill="${C.ink}"/><text x="34" y="62" font-family="Onest" font-weight="500" font-size="28" fill="#B9B4AA">Заказов: 0</text><text x="34" y="132" font-family="Onest" font-weight="800" font-size="46" fill="#fff">Баланс ↑</text><rect x="34" y="152" width="200" height="16" rx="8" fill="${C.lime}"/></g>`);
  // sofa
  el(s,`<rect x="140" y="760" width="800" height="230" rx="60" fill="${C.orange}"/><rect x="140" y="600" width="800" height="200" rx="60" fill="#FFB938"/><rect x="110" y="700" width="120" height="290" rx="50" fill="#E89200"/><rect x="850" y="700" width="120" height="290" rx="50" fill="#E89200"/>`);
  el(s,courier({x:330,y:960,s:.78,pose:'sit',hairStyle:1,jacket:C.lime,skin:'#E8B48C'}));
  el(s,courier({x:560,y:960,s:.78,pose:'sit',hairStyle:0}));
  el(s,courier({x:780,y:960,s:.78,pose:'sit',hairStyle:2,skin:'#C98E63',hair:'#1E1A22'}));
  el(s,`<rect x="160" y="990" width="40" height="70" rx="12" fill="#C47A00"/><rect x="880" y="990" width="40" height="70" rx="12" fill="#C47A00"/>`);
})();
</script>
</body></html>
