<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
html,body{margin:0;background:#F7F2EB} .wrap{width:900px;height:1000px;display:flex;align-items:center;justify-content:center}
</style></head><body><div class="wrap"><svg id="c" width="900" height="1000" viewBox="-450 -820 900 1000"></svg></div>
<script>const NS='http://www.w3.org/2000/svg';
const C={ink:'#17171C',heart:'#FA084E',orange:'#FEA202',peach:'#FFEFD5',lime:'#8CD23C',lime2:'#6DB22A',lime3:'#4E8A1A',skin:'#F2C29B',skin2:'#E2A97E',hair:'#2B2235',pants:'#2F3140',block:'#FFFFFF',road:'#EFE8DE',tree:'#C9E7A6'};
const el=(svg,html)=>{svg.insertAdjacentHTML('beforeend',html)};

// ---------- jelly-bean mascot courier (Choco heart colour, glossy) ----------
let GID=0;
const PAL={red:['#FA084E','#C7003C','#FF6C93'],orange:['#FEA202','#D47F00','#FFC95C'],lime:['#8CD23C','#5E9A1E','#B9EA7E']};
function courier({x=0,y=0,s=1,pose='stand',col='red',cap=false,strap=false,act='none'}={}){
  const OL='#24161E', W=10, [B,D,L]=PAL[col], id='g'+(GID++);
  const st=''; const ln=`stroke="${OL}" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"`;
  const by = pose==='sit'? 60 : 0;   // shift body down when sitting (legs hidden by cushion)
  const defs=`<defs><radialGradient id="${id}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="${L}"/><stop offset=".45" stop-color="${B}"/><stop offset="1" stop-color="${D}"/></radialGradient></defs>`;
  const body=`<path d="M0 ${-560+by} C150 ${-560+by} 212 ${-470+by} 212 ${-330+by} L202 ${-160+by} C198 ${-112+by} 160 ${-90+by} 118 ${-90+by} L-118 ${-90+by} C-160 ${-90+by} -198 ${-112+by} -202 ${-160+by} L-212 ${-330+by} C-212 ${-470+by} -150 ${-560+by} 0 ${-560+by}Z" fill="${B}"/>`;
  const gloss=`<clipPath id="${id}c"><path d="M0 ${-560+by} C150 ${-560+by} 212 ${-470+by} 212 ${-330+by} L202 ${-160+by} C198 ${-112+by} 160 ${-90+by} 118 ${-90+by} L-118 ${-90+by} C-160 ${-90+by} -198 ${-112+by} -202 ${-160+by} L-212 ${-330+by} C-212 ${-470+by} -150 ${-560+by} 0 ${-560+by}Z"/></clipPath>
    <g clip-path="url(#${id}c)"><ellipse cx="150" cy="${-260+by}" rx="120" ry="260" fill="${D}" opacity=".35"/></g>`;
  const legs = pose==='sit'
    ? `<path d="M-96 0 h64 v66 a32 32 0 0 1 -64 0z" fill="${D}"/><path d="M32 0 h64 v66 a32 32 0 0 1 -64 0z" fill="${D}"/>`
    : `<path d="M-100 -110 h68 v76 a34 34 0 0 1 -68 0z" fill="${D}" ${st}/><path d="M32 -110 h68 v76 a34 34 0 0 1 -68 0z" fill="${D}"/>`;
  const armL=(rot=18)=>`<ellipse cx="-222" cy="${-250+by}" rx="40" ry="84" transform="rotate(${rot} -222 ${-250+by})" fill="${D}" ${st}/>`;
  const armR=(rot=-18)=>`<ellipse cx="222" cy="${-250+by}" rx="40" ry="84" transform="rotate(${rot} 222 ${-250+by})" fill="${D}"/>`;
  let arms=armL()+armR(), front='';
  if(act==='wave') arms=armL()+`<ellipse cx="250" cy="${-420+by}" rx="40" ry="84" transform="rotate(-30 250 ${-420+by})" fill="${D}" ${st}/>`;
  if(act==='phone'){ arms=armL(); front=`<g transform="translate(170 ${-300+by}) rotate(-10)"><rect x="-34" y="-60" width="68" height="112" rx="14" fill="${OL}"/><rect x="-26" y="-50" width="52" height="86" rx="8" fill="#9FD7FF"/></g><ellipse cx="200" cy="${-250+by}" rx="44" ry="40" fill="${D}" ${st}/>`; }
  if(act==='bag'){ arms=armL(); front=`<g transform="translate(250 ${-190+by})"><path d="M-70 -64 h140 l12 170 h-164z" fill="#EBCFA6"/><path d="M-34 -64 q0 -46 34 -46 q34 0 34 46" fill="none" ${ln}/>
      <rect x="-52" y="-104" width="24" height="56" rx="8" fill="#FFD43B" ${st} transform="rotate(-14 -40 -76)"/><circle cx="26" cy="-80" r="22" fill="#8CD23C" ${st}/>
      <path d="M0 46 C-30 22 -26 0 -10 0 C-4 0 0 4 0 9 C0 4 4 0 10 0 C26 0 30 22 0 46Z" fill="${C.heart}"/></g><ellipse cx="236" cy="${-262+by}" rx="42" ry="40" fill="${D}" ${st}/>`; }
  if(act==='mug'){ arms=''; front=`<g transform="translate(0 ${-200+by})"><rect x="-44" y="-50" width="88" height="90" rx="18" fill="#fff" ${st}/><path d="M44 -30 q28 0 28 22 q0 22 -28 22" fill="none" ${ln}/><rect x="-34" y="-40" width="68" height="16" rx="8" fill="#C98A5A"/></g>
      <ellipse cx="-70" cy="${-196+by}" rx="40" ry="34" fill="${D}" ${st}/><ellipse cx="70" cy="${-196+by}" rx="40" ry="34" fill="${D}" ${st}/>`; }
  const ey=-388+by;
  const face=`<ellipse cx="-74" cy="${ey}" rx="54" ry="60" fill="#fff" ${st}/><ellipse cx="74" cy="${ey}" rx="54" ry="60" fill="#fff" ${st}/>
    <circle cx="-66" cy="${ey+8}" r="32" fill="${OL}"/><circle cx="66" cy="${ey+8}" r="32" fill="${OL}"/>
    <circle cx="-56" cy="${ey-6}" r="11" fill="#fff"/><circle cx="76" cy="${ey-6}" r="11" fill="#fff"/>
    <path d="M-104 ${ey+98} Q0 ${ey+168} 104 ${ey+98}" stroke="${OL}" stroke-width="9" fill="none" stroke-linecap="round"/>`;
  const capG=cap?`<path d="M-150 ${-520+by} A150 108 0 0 1 150 ${-520+by} Z" fill="${C.lime}"/><path d="M0 ${-628+by} V${-522+by}" stroke="${C.lime2}" stroke-width="8" stroke-linecap="round" opacity=".6"/><path d="M-156 ${-524+by} Q0 ${-540+by} 156 ${-524+by} Q158 ${-502+by} 126 ${-494+by} Q0 ${-456+by} -126 ${-494+by} Q-158 ${-502+by} -156 ${-524+by}Z" fill="${C.lime2}"/><circle cx="0" cy="${-628+by}" r="13" fill="${C.lime2}"/>`:'';
  const strapG=strap?`<path d="M204 ${-250+by} L-196 ${-128+by}" stroke="${C.lime}" stroke-width="28" stroke-linecap="round"/>`:'';
  const T=`transform="translate(${x} ${y}) scale(${s})"`;
  const shadow=pose==='sit'?'':`<ellipse cx="0" cy="4" rx="170" ry="18" fill="#17171C" opacity=".08"/>`;
  if(pose==='sit') return {back:`<g ${T}>${defs}${arms}${body}${gloss}${strapG}${face}${capG}${front}</g>`, front:`<g ${T}>${legs}</g>`};
  return `<g ${T}>${defs}${shadow}${legs}${arms}${body}${gloss}${strapG}${face}${capG}${front}</g>`;
}


document.getElementById('c').insertAdjacentHTML('beforeend',courier({x:0,y:80,s:1.25,cap:true}));
</script></body></html>
