<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
@font-face{font-family:Onest;font-weight:800;src:url(fonts/onest-cyrillic-800-normal.woff2)}
@font-face{font-family:Onest;font-weight:800;src:url(fonts/onest-latin-800-normal.woff2);unicode-range:U+0000-00FF}
html,body{margin:0;background:#0E0E10}
.sheet{display:flex;gap:24px;padding:24px}
svg{display:block;border-radius:8px}
text{font-family:Onest}
</style></head><body><div class="sheet"><!-- ===== VARIANT A · flat rounded squares ===== -->
<svg width="540" height="960" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#FCE000"/>
  <text x="96" y="200" font-weight="800" font-size="64" fill="#1B1B1F">Герой · вариант A</text>

  <rect x="96" y="300" width="888" height="1200" rx="56" fill="#FFF4A3"/>

  <g transform="translate(540,0)">
    <defs>
      <clipPath id="torsoC"><rect x="-260" y="1010" width="520" height="490" rx="120"/></clipPath>
      <clipPath id="headC"><rect x="-200" y="560" width="400" height="420" rx="130"/></clipPath>
    </defs>
    <g transform="translate(-320,880)">
      <rect width="640" height="560" rx="48" fill="#C9B200" transform="translate(16,16)"/>
      <rect width="640" height="560" rx="48" fill="#FCE000" stroke="#1B1B1F" stroke-width="10"/>
      <rect width="640" height="110" rx="48" fill="#FFF07A" stroke="#1B1B1F" stroke-width="10"/>
    </g>
    <!-- torso -->
    <rect x="-260" y="1010" width="520" height="490" rx="120" fill="#1B1B1F"/>
    <rect x="60" y="1010" width="220" height="490" fill="#2E2E35" clip-path="url(#torsoC)"/>
    <path d="M140 1010 h0" />
    <!-- hood collar -->
    <rect x="-130" y="980" width="260" height="90" rx="45" fill="#2E2E35"/>
    <!-- neck -->
    <rect x="-56" y="920" width="112" height="110" rx="40" fill="#D9926B"/>
    <!-- ears -->
    <rect x="-232" y="720" width="80" height="110" rx="34" fill="#E7A982"/>
    <rect x="152" y="720" width="80" height="110" rx="34" fill="#E7A982"/>

    <rect x="-200" y="560" width="400" height="420" rx="130" fill="#F1BE95"/>
    <rect x="90" y="560" width="140" height="420" fill="#E7A982" opacity=".35" clip-path="url(#headC)"/>
    <!-- hair block with angled fringe -->
    <path d="M-212 700 L-212 640 Q-212 500 -60 500 L80 500 Q212 500 212 640 L212 690 L120 690 L60 640 L-40 680 L-120 650 L-150 710Z" fill="#2A2238"/>
    <rect x="-120" y="520" width="200" height="26" rx="13" fill="#4B3E63"/>

    <rect x="-132" y="730" width="96" height="24" rx="12" fill="#2A2238"/>
    <rect x="36" y="730" width="96" height="24" rx="12" fill="#2A2238"/>

    <rect x="-110" y="776" width="52" height="72" rx="24" fill="#1B1B1F"/><rect x="58" y="776" width="52" height="72" rx="24" fill="#1B1B1F"/>
    <rect x="-96" y="788" width="18" height="22" rx="9" fill="#FFFFFF"/><rect x="72" y="788" width="18" height="22" rx="9" fill="#FFFFFF"/>
    <!-- nose -->
    <rect x="-14" y="830" width="40" height="48" rx="20" fill="#E09A73"/>
    <!-- smile: half rounded rect -->
    <path d="M-80 892 H80 Q80 960 0 960 Q-80 960 -80 892Z" fill="#1B1B1F"/>
    <path d="M-60 892 H60 V910 Q0 920 -60 910Z" fill="#FFFFFF"/>
    <path d="M-36 944 Q0 960 36 944 Q30 932 0 932 Q-30 932 -36 944Z" fill="#FF7A6B"/>

    <rect x="-176" y="860" width="70" height="36" rx="18" fill="#FF8A7A" opacity=".45"/><rect x="106" y="860" width="70" height="36" rx="18" fill="#FF8A7A" opacity=".45"/>

    <g stroke="#1B1B1F" stroke-width="8" stroke-linejoin="round" fill="#FCE000">
      <path d="M-232 1012 Q-222 962 -160 962 L-146 963 Q-146 1012 -142 1062 L-116 1500 L-184 1500 L-210 1084 Q-228 1046 -232 1012Z"/>
      <path d="M232 1012 Q222 962 160 962 L146 963 Q146 1012 142 1062 L116 1500 L184 1500 L210 1084 Q228 1046 232 1012Z"/>
    </g>
    <path d="M-160 1080 L-138 1496 L-124 1496 L-146 1080Z" fill="#E3C800"/>
    <path d="M160 1080 L138 1496 L124 1496 L146 1080Z" fill="#E3C800"/>
    <rect x="-200" y="1126" width="72" height="30" rx="10" fill="#3A3A44"/><rect x="128" y="1126" width="72" height="30" rx="10" fill="#3A3A44"/>
    <!-- chest strap + buckle -->
    <rect x="-150" y="1250" width="300" height="34" rx="17" fill="#1B1B1F"/>
    <rect x="-46" y="1234" width="92" height="66" rx="20" fill="#5A5A66"/><rect x="-26" y="1254" width="52" height="26" rx="10" fill="#1B1B1F"/>
    <!-- arm + thumbs up -->
    <rect x="170" y="1180" width="150" height="320" rx="64" fill="#2E2E35" transform="rotate(-12 245 1340)"/>
    <g transform="translate(250,1070)">
      <rect x="-60" y="0" width="150" height="140" rx="44" fill="#F1BE95"/>
      <rect x="-44" y="-96" width="60" height="124" rx="30" fill="#F1BE95"/>
      <rect x="20" y="36" width="70" height="22" rx="11" fill="#E09A73"/><rect x="20" y="78" width="70" height="22" rx="11" fill="#E09A73"/>
    </g>
  </g>
  <text x="96" y="1620" font-weight="800" font-size="44" fill="#1B1B1F">Чистая графика, как иконки</text>
  <text x="96" y="1680" font-weight="800" font-size="36" fill="#6B5E00">Легко анимировать мимику и жесты</text>
</svg>

</div></body></html>
