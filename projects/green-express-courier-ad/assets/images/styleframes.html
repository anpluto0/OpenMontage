<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
@font-face{font-family:Onest;font-weight:800;src:url(fonts/onest-cyrillic-800-normal.woff2)}
@font-face{font-family:Onest;font-weight:800;src:url(fonts/onest-latin-800-normal.woff2);unicode-range:U+0000-00FF,U+20B8}
@font-face{font-family:Onest;font-weight:500;src:url(fonts/onest-latin-400-normal.woff2);unicode-range:U+0000-00FF,U+20B8}
@font-face{font-family:Onest;font-weight:500;src:url(fonts/onest-cyrillic-400-normal.woff2)}
:root{--yel:#FCE000;--ink:#1E1E1E;--grey:#B9BCC4;--grey2:#8E929C;--green:#21A038;--wa:#25D366;--skin:#E9B98F;--hoodie:#2B2D42}
body{margin:0;background:#111;display:flex;gap:24px;padding:24px;font-family:Onest,sans-serif}
.f{width:540px;height:960px;position:relative;overflow:hidden;border-radius:6px}
.cap{position:absolute;left:0;right:0;text-align:center;font-weight:800;color:var(--ink)}
.cap span{background:#fff;padding:10px 18px;border-radius:16px;box-shadow:0 6px 0 rgba(0,0,0,.15);display:inline-block;line-height:1.15}
.tag{position:absolute;top:10px;left:10px;color:#fff;font:500 14px Onest;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:6px}
</style></head><body>

<!-- FRAME 1: HOOK -->
<div class="f" style="background:#D9DBE0">
<svg width="540" height="960" viewBox="0 0 540 960">
 <rect x="0" y="640" width="540" height="320" fill="#C3C6CD"/>
 <!-- window -->
 <rect x="40" y="120" width="170" height="210" rx="8" fill="#AEB7C6" stroke="#9AA0AA" stroke-width="8"/>
 <line x1="125" y1="120" x2="125" y2="330" stroke="#9AA0AA" stroke-width="6"/>
 <!-- calendar -->
 <g transform="translate(300,170) rotate(3)">
  <rect width="200" height="230" rx="12" fill="#fff" stroke="var(--ink)" stroke-width="5"/>
  <rect width="200" height="50" rx="12" fill="#E5484D" stroke="var(--ink)" stroke-width="5"/>
  <text x="100" y="35" text-anchor="middle" font-family="Onest" font-weight="800" font-size="22" fill="#fff">НОЯБРЬ</text>
  <g font-family="Onest" font-weight="500" font-size="16" fill="#555">
   <text x="22" y="85">1</text><text x="58" y="85">2</text><text x="94" y="85">3</text><text x="130" y="85">4</text><text x="166" y="85">5</text>
   <text x="22" y="120">8</text><text x="58" y="120">9</text><text x="90" y="120">10</text><text x="126" y="120">11</text><text x="162" y="120">12</text>
   <text x="18" y="155">15</text><text x="54" y="155">16</text><text x="90" y="155">17</text><text x="126" y="155">18</text><text x="162" y="155">19</text>
   <text x="18" y="190">22</text><text x="54" y="190">23</text><text x="90" y="190">24</text><text x="126" y="190">25</text><text x="162" y="190">26</text>
  </g>
  <circle cx="171" cy="185" r="20" fill="none" stroke="#E5484D" stroke-width="4"/>
  <line x1="12" y1="75" x2="40" y2="92" stroke="var(--ink)" stroke-width="3"/><line x1="40" y1="75" x2="12" y2="92" stroke="var(--ink)" stroke-width="3"/>
 </g>
 <g transform="translate(320,420) rotate(-2)">
  <rect width="180" height="44" rx="10" fill="var(--ink)"/>
  <text x="90" y="29" text-anchor="middle" font-family="Onest" font-weight="800" font-size="17" fill="#fff">до зарплаты: 29 дней</text>
 </g>
 <!-- hero -->
 <g transform="translate(70,330)">
  <path d="M40 330 Q30 230 70 180 L190 180 Q230 230 220 330 Z" fill="var(--hoodie)" stroke="var(--ink)" stroke-width="5"/>
  <path d="M95 180 Q130 215 165 180" fill="none" stroke="#fff" stroke-width="4"/>
  <circle cx="130" cy="110" r="70" fill="var(--skin)" stroke="var(--ink)" stroke-width="5"/>
  <path d="M62 95 Q70 30 135 35 Q200 35 200 100 Q180 70 150 75 Q120 55 62 95Z" fill="var(--ink)"/>
  <ellipse cx="150" cy="112" rx="7" ry="9" fill="var(--ink)"/><ellipse cx="185" cy="112" rx="6" ry="9" fill="var(--ink)"/>
  <path d="M140 92 L162 98 M178 98 L196 92" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
  <path d="M155 150 Q170 142 185 150" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
  <path d="M215 60 q8 18 0 26 q-8 -8 0 -26z" fill="#6EC1FF" stroke="var(--ink)" stroke-width="3"/>
  <!-- phone -->
  <g transform="translate(150,215) rotate(-10)">
   <rect width="70" height="120" rx="12" fill="var(--ink)"/><rect x="6" y="10" width="58" height="100" rx="6" fill="#fff"/>
   <text x="35" y="58" text-anchor="middle" font-family="Onest" font-weight="500" font-size="10" fill="#888">Баланс</text>
   <text x="35" y="80" text-anchor="middle" font-family="Onest" font-weight="800" font-size="22" fill="#E5484D">0 ₸</text>
  </g>
  <path d="M175 300 q-20 -50 0 -80" fill="none" stroke="var(--ink)" stroke-width="0"/>
 </g>
</svg>
<div class="cap" style="top:60px;font-size:44px"><span>Деньги нужны<br>уже сегодня?</span></div>
<div class="tag">0–3 с · хук</div>
</div>

<!-- FRAME 2: TURN -->
<div class="f" style="background:linear-gradient(#8FD3FF,#CFEFFF 60%)">
<svg width="540" height="960" viewBox="0 0 540 960">
 <path d="M0 520 L90 380 L150 450 L250 300 L330 420 L410 340 L540 480 L540 600 L0 600Z" fill="#7C8DB5"/>
 <path d="M220 330 L250 300 L280 340 L262 335 L250 350 Z" fill="#fff"/><path d="M385 365 L410 340 L432 368 Z" fill="#fff"/>
 <path d="M0 580 L120 470 L220 560 L330 490 L460 570 L540 520 L540 640 L0 640Z" fill="#5E7AA0"/>
 <rect x="20" y="520" width="60" height="140" fill="#F2C14E" stroke="var(--ink)" stroke-width="4"/>
 <rect x="440" y="500" width="80" height="160" fill="#F08A5D" stroke="var(--ink)" stroke-width="4"/>
 <rect x="0" y="650" width="540" height="310" fill="#4A4E57"/>
 <g stroke="#fff" stroke-width="8" stroke-dasharray="40 30"><line x1="0" y1="800" x2="540" y2="800"/></g>
 <!-- speed lines -->
 <g stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"><line x1="20" y1="640" x2="110" y2="640"/><line x1="40" y1="700" x2="150" y2="700"/><line x1="10" y1="760" x2="90" y2="760"/></g>
 <!-- bike -->
 <g transform="translate(150,560)">
  <circle cx="40" cy="230" r="58" fill="none" stroke="var(--ink)" stroke-width="9"/>
  <circle cx="260" cy="230" r="58" fill="none" stroke="var(--ink)" stroke-width="9"/>
  <path d="M40 230 L120 140 L210 140 L260 230 M120 140 L150 230 L210 140 M150 230 L40 230" fill="none" stroke="var(--green)" stroke-width="10" stroke-linejoin="round"/>
  <line x1="210" y1="140" x2="225" y2="95" stroke="var(--ink)" stroke-width="8"/><line x1="210" y1="95" x2="245" y2="95" stroke="var(--ink)" stroke-width="8" stroke-linecap="round"/>
  <!-- rider -->
  <path d="M105 140 L160 60 L225 100" fill="none" stroke="var(--hoodie)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M120 140 L150 230" stroke="#3A5BA0" stroke-width="22" stroke-linecap="round"/>
  <!-- thermo bag -->
  <g transform="translate(45,-40) rotate(-12)">
   <rect width="120" height="110" rx="14" fill="var(--yel)" stroke="var(--ink)" stroke-width="6"/>
   <rect x="20" y="30" width="80" height="44" rx="8" fill="none" stroke="var(--ink)" stroke-width="4" stroke-dasharray="6 6"/>
   <text x="60" y="60" text-anchor="middle" font-family="Onest" font-weight="800" font-size="13" fill="var(--ink)">ЛОГО</text>
  </g>
  <circle cx="190" cy="20" r="48" fill="var(--skin)" stroke="var(--ink)" stroke-width="5"/>
  <path d="M142 15 Q150 -35 200 -30 Q240 -25 238 15 Q215 0 190 5 Q165 -5 142 15Z" fill="var(--ink)"/>
  <path d="M200 40 Q215 55 230 40" fill="#fff" stroke="var(--ink)" stroke-width="4"/>
  <ellipse cx="205" cy="18" rx="5" ry="7" fill="var(--ink)"/><ellipse cx="228" cy="18" rx="5" ry="7" fill="var(--ink)"/>
 </g>
</svg>
<div class="cap" style="top:90px;font-size:46px"><span style="background:var(--yel)">Курьер<br>Яндекс Еды</span></div>
<div class="tag">10.5–13 с · поворот</div>
</div>

<!-- FRAME 3: CTA -->
<div class="f" style="background:var(--yel)">
<div style="position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;gap:16px">
 <div style="width:150px;height:70px;border:3px dashed var(--ink);border-radius:14px;display:flex;align-items:center;justify-content:center;font:800 15px Onest;text-align:center">лого<br>Green Express</div>
 <div style="width:150px;height:70px;border:3px dashed var(--ink);border-radius:14px;display:flex;align-items:center;justify-content:center;font:800 15px Onest;text-align:center">лого<br>Яндекс Еды</div>
</div>
<div class="cap" style="top:250px;font-size:54px;line-height:1.1">Пиши<br>в WhatsApp 👇</div>
<div style="position:absolute;top:470px;left:50%;transform:translateX(-50%);width:300px;height:300px;border-radius:50%;background:rgba(37,211,102,.25);display:flex;align-items:center;justify-content:center">
 <div style="width:210px;height:210px;border-radius:50%;background:var(--wa);border:6px solid var(--ink);display:flex;align-items:center;justify-content:center">
  <svg width="110" height="110" viewBox="0 0 24 24"><path fill="#fff" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>
 </div>
</div>
<div class="cap" style="top:810px;font-size:24px"><span style="background:var(--ink);color:#fff">Подключение 15 минут · бесплатно</span></div>
<div class="cap" style="top:900px;font:500 13px Onest;color:#333">Green Express — официальный партнёр Яндекс Еды · 18+, граждане РК</div>
<div class="tag">19–24 с · призыв</div>
</div>
</body></html>
